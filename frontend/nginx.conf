# Конфиг nginx для SPA "Региональная модель".
#  - отдаёт статику собранного frontend;
#  - проксирует /api/* на backend (сервис backend:8000 в compose);
#  - SPA-fallback: любой неизвестный путь -> index.html (клиентский роутинг).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Не отдавать "мусорные" dot-файлы.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # API -> Django (gunicorn).
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Импорт больших моделей/снимков — поднимаем лимит тела запроса.
        client_max_body_size 32m;
        proxy_read_timeout   120s;
    }

    # Ассеты с хешем в имени — кэшируем надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Всё остальное — SPA: сначала файл, иначе index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
