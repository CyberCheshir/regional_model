services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regional_model}
      POSTGRES_USER: ${POSTGRES_USER:-regional_model}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regional_model_change_me}
    ports:
      # Публикуем наружу для подключения из DBeaver/psql с хоста.
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regional_model}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    env_file: ./.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  db_data:
